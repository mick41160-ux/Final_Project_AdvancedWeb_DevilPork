<div class="flex flex-col gap-3; min-h-screen w-500; overflow-y-auto; p-1">
    <p class="text-[40px] font-bold">จัดการลูกค้า</p>
    <p class="text-[13px] font-light text-gray-400">ข้อมูลลูกค้าและจุดจัดส่งในพื้นที่ให้บริการ</p>
    <div class="flex flex-row gap-5 mt-5 h-180">
        <div class="flex flex-col bg-white rounded-lg shadow-md w-500 h-full">
            <p class="text-[20px] p-5">ข้อมูลลูกค้า</p>
            <div class="overflow-x-auto">
                <div class="bg-white p-3 border border-slate-200 rounded-xl flex items-center gap-3 w-full max-w-xl">

             
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400 " fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>

                   
                    <input type="text" placeholder="ค้นหาชื่อ เบอร์โทร หรือเลขรายการ"
                        class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:border-blue-400 transition-colors" />

                </div>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                รหัสลูกค้า</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                ลูกค้า</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                พิกัด
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                ที่อยู่
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                จัดการ
                            </th>
                        </tr>

                    </thead>

                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- <tr *ngFor="let order of orders"> -->
                        <tr>
                            <td class="px-6 text-xs py-4 whitespace-nowrap">ID-1</td>
                            <td class="px-6 text-xs py-4 whitespace-nowrap">พิมพ์ชนก ใจดี</td>
                            <td class="px-6 text-xs py-4 whitespace-nowrap">10.250.24.21</td>
                            <td class="px-6 text-xs py-4 whitespace-nowrap">หอพักบ้านสวน · ท่าขอนยาง</td>
                            <td>
                                <button class=" text-xs py-4 whitespace-nowrap"
                                    (click)="editOrder($event)">แก้ไข</button>
                                <button class="pl-3 text-xs py-4 whitespace-nowrap"
                                    (click)="deleteOrder($event)">ลบ</button>
                            </td>
                        </tr>
                        <!-- </tr> -->

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
